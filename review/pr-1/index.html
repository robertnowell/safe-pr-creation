:root{--bg:#F7F8FB;--dark:#090B15;--dark2:#0F111E;--ink:#1F212F;--accent:#5A52EC;--accent2:#A9A4FF;--border:#DDE2EB;--border2:#EEF0F5;--muted:rgba(31,33,47,.7);--faint:rgba(31,33,47,.38);--green:#1F9D63;--amber:#D98B1A;--red:#E5484D}

.pixels{pointer-events:none;position:absolute;inset:0;width:100%;height:100%}

.win{display:flex;flex-direction:column;overflow:hidden;border-radius:16px;background:#fff;border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 48px -20px rgba(31,33,47,.25);min-width:0}

const feats = D.features; const done = () => feats.filter(f => S.approved[f.id]).length;
const gatesOk = () => D.checks.every(c => c.state === 'pass' || c.who === 'Person');
slides.push({ title: 'Goal', dark: true, html: () => `${field()}<div class="pad" style="justify-content:flex-end">${kick(`Safe PR review · ${D.pr.repo} · PR #${D.pr.number}`, true)}<div class="h dk-display dk-in" style="animation-delay:.14s;font-size:clamp(44px,6.2vw,112px);max-width:14ch">${esc(D.goal.text)}</div><div class="sub dk-in" style="animation-delay:.4s">${esc(D.goal.why)}</div><div class="sm dk-mono dk-in" style="animation-delay:.55s">${esc(D.pr.title)} · by ${esc(D.pr.author)} · ${D.pr.stats ? `${D.pr.stats.files} files · +${D.pr.stats.additions.toLocaleString()} −${D.pr.stats.deletions.toLocaleString()}` : ''}</div></div>` });
const archSlide = (g, which) => ({ title: which === 'before' ? 'Before' : 'After', dark: false, html: () => `<div class="pad"><div class="grid2" style="grid-template-columns:.72fr 1.28fr"><div class="col">${kick(`Architecture · ${which}`, false)}<div class="h dk-display dk-in" style="animation-delay:.14s;font-size:clamp(34px,4.2vw,76px)">${esc(g.headline)}</div><div class="sub dk-in" style="animation-delay:.35s">${which === 'before' ? esc(D.architecture.beforeText || '') : esc(D.architecture.afterText || '')}</div>${which === 'after' ? `<div class="dk-in" style="animation-delay:.5s;display:flex;gap:14px;flex-wrap:wrap" class="dk-mono"><span class="pill" style="background:var(--accent);color:#fff">new</span><span class="pill" style="border:2px solid var(--accent);color:var(--accent)">changed</span><span class="pill" style="border:1.5px dashed var(--amber);color:var(--amber)">planned</span></div>` : `<div class="dk-in" style="animation-delay:.5s"><span class="pill" style="border:1.5px dashed var(--red);color:var(--red)">replaced by this PR</span></div>`}</div><div class="arch dk-in" style="animation-delay:.3s">${archSVG(g)}</div></div></div>` });
function archSVG(g) {
  const cols = Math.max(...g.nodes.map(n => n.x)) + 1, rowsN = Math.max(...g.nodes.map(n => n.y)) + 1; const cw = 210, ch = 76, gx = 262, gy = 160, ox = 8, oy = 40; const W = ox * 2 + cols * gx - (gx - cw), H = oy * 2 + rowsN * gy - (gy - ch);
  const pos = (n) => ({ x: ox + n.x * gx, y: oy + n.y * gy });
  const byId = Object.fromEntries(g.nodes.map(n => [n.id, n]));
  const edges = g.edges.map(([a, b, label]) => { const A = pos(byId[a]), B = pos(byId[b]); const hot = ['new', 'changed'].includes(byId[b].state) || byId[a].state === 'new'; const planned = byId[a].state === 'planned' || byId[b].state === 'planned'; let x1, y1, x2, y2; if (A.y === B.y) { x1 = A.x + cw; y1 = A.y + ch / 2; x2 = B.x; y2 = B.y + ch / 2; } else { x1 = A.x + cw / 2; y1 = A.y + ch; x2 = B.x + cw / 2; y2 = B.y; if (A.y > B.y) { y1 = A.y; y2 = B.y + ch; } } const mx = (x1 + x2) / 2, my = (y1 + y2) / 2; return `<path class="edge ${hot ? 'hot' : ''} ${planned ? 'planned' : ''}" d="M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}" marker-end="url(#ar)"/><text class="el" x="${mx}" y="${my - 6}" text-anchor="middle">${esc(label)}</text>`; }).join('');
  const nodes = g.nodes.map(n => { const p = pos(n); const st = n.state || ''; return `<g class="${st}"><rect class="node ${st}" x="${p.x}" y="${p.y}" width="${cw}" height="${ch}" rx="12"/><text class="nk" x="${p.x + 14}" y="${p.y + 22}">${esc(n.kicker || '')}</text><text class="nl" x="${p.x + 14}" y="${p.y + 48}">${esc(n.label)}</text>${st === 'new' ? `<rect x="${p.x + cw - 44}" y="${p.y + ch - 24}" width="36" height="16" rx="8" fill="rgba(255,255,255,.22)"/><text class="badge" x="${p.x + cw - 26}" y="${p.y + ch - 12.5}" text-anchor="middle">NEW</text>` : ''}</g>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9C0CE"/></marker></defs>${edges}${nodes}</svg>`;
}
slides.push(archSlide(D.architecture.before, 'before')); slides.push(archSlide(D.architecture.after, 'after'));
slides.push({ title: 'Risks', dark: true, html: () => `${field()}<div class="pad"><div class="grid2" style="grid-template-columns:.8fr 1.2fr"><div class="col">${kick('Risks', true)}<div class="h dk-display dk-in" style="animation-delay:.14s">What breaks if this goes wrong.</div></div><div class="rows">${D.risks.map((r, i) => `<div class="r dk-in" style="animation-delay:${.4 + i * .12}s"><span class="n dk-mono">0${i + 1}</span><span class="t">${esc(r.risk)}<small>${esc(r.gate)}</small></span></div>`).join('')}</div></div></div>` });
slides.push({ title: 'Checks', dark: false, html: () => { const g = D.checks.filter(c => c.who === 'Gate'), p = D.checks.filter(c => c.who !== 'Gate'); const gp = g.filter(c => c.state === 'pass').length; return `<div class="pad">${kick('QA checklist', false)}<div class="h dk-display dk-in" style="animation-delay:.14s;font-size:clamp(34px,4.2vw,76px)"><span class="${gp === g.length ? '' : ''}">${gp} of ${g.length} gates passed.</span> <span style="color:var(--faint)">${p.length} are yours.</span></div><div class="cards">${D.checks.map((c, i) => `<div class="card dk-in" style="animation-delay:${.3 + i * .06}s"><span class="cn dk-mono">${esc(c.who)}</span><span class="ct">${esc(c.check)}</span><span class="cd">${esc(c.detail || c.evidence || '')}</span><span class="pill dk-mono ${c.state === 'pass' ? 'pass' : c.state === 'fail' ? 'fail' : 'na'}"><i></i>${c.state === 'pass' ? 'passed' : c.state === 'fail' ? 'failed' : 'not checked'}</span></div>`).join('')}</div></div>`; } });
feats.forEach((f, fi) => slides.push({ title: f.title, dark: false, feature: fi, html: () => `<div class="pad" style="gap:14px">${kick(`Feature ${fi + 1} of ${feats.length} · ${S.approved[f.id] ? 'approved' : 'open'}`, false)}<div class="rv"><div class="left"><div class="h dk-display dk-in" style="animation-delay:.14s;font-size:clamp(28px,3.2vw,56px)">${esc(f.title)}</div><div class="exp dk-in" style="animation-delay:.3s"><b>Expect</b> ${esc(f.expect)}</div><div class="exp dk-in" style="animation-delay:.4s"><b>Agent found</b> ${esc(f.found)}</div><div class="clist dk-mono" id="clist"></div><div class="btns dk-in" style="animation-delay:.5s"><span class="btn ok" id="approve">Looks right</span><span class="btn" id="submitc">Submit as comments</span><span class="btn p" id="submitf">Submit and ask the agent to fix</span></div></div><div class="col dk-in" style="animation-delay:.3s;gap:12px"><div class="ctl"><div class="seg dk-mono" id="seg"><span data-vp="mobile">Mobile</span><span data-vp="desktop">Desktop</span></div><div class="tabs" id="tabs"><span data-mode="shot">Screenshot</span><span data-mode="video">Video</span><span data-mode="live">Live page</span></div><span class="sm dk-mono" id="meta" style="margin-left:auto"></span></div><div class="pair" id="pair"></div></div></div></div>` }));
slides.push({ title: 'Why', dark: true, html: () => `${field()}<div class="pad" style="justify-content:flex-end">${kick('Why this exists', true)}<div class="h dk-display dk-in" style="animation-delay:.14s;font-size:clamp(40px,5.6vw,100px)">${esc(D.why.headline)}</div><div class="sub dk-in" style="animation-delay:.35s">${esc(D.why.text)}</div><div class="loop dk-mono dk-in" style="animation-delay:.5s">${(D.why.steps || []).map((s, i) => `${i ? '<span class="a">→</span>' : ''}<span class="s">${esc(s)}</span>`).join('')}<span class="a">↺</span></div><div class="lock dk-mono dk-in ${done() === feats.length && gatesOk() ? 'open' : ''}" style="animation-delay:.6s"><i></i>${done()} of ${feats.length} features approved · merge ${done() === feats.length && gatesOk() ? 'unlocked' : 'locked'}</div></div>` });

// ---- render ----
const root = $('#root');
root.innerHTML = slides.map((s, i) => `<section class="dk-slide ${s.dark ? 'dark' : 'light'}" data-i="${i}" aria-label="${i + 1} of ${slides.length}: ${esc(s.title)}" style="background:${s.dark ? '#090B15' : '#F7F8FB'}"></section>`).join('');
$('#uititle').textContent = `Safe PR review · PR #${D.pr.number}`;
$('#prog').innerHTML = slides.map((s, i) => `<button data-i="${i}" aria-label="Go to ${esc(s.title)}"><span></span></button>`).join('');
function show(i) {
  S.i = Math.max(0, Math.min(slides.length - 1, i)); const s = slides[S.i];
  document.querySelectorAll('.dk-slide').forEach((el, k) => { if (k === S.i) { if (!el.innerHTML) el.innerHTML = s.html(); else if (s.feature != null || s.title === 'Why') el.innerHTML = s.html(); el.setAttribute('data-on', ''); } else el.removeAttribute('data-on'); });
  root.style.background = s.dark ? '#090B15' : '#F7F8FB'; document.body.classList.toggle('light-ui', !s.dark);
  document.querySelectorAll('#prog button').forEach((b, k) => b.classList.toggle('on', k <= S.i));
  $('#uicount').textContent = `${String(S.i + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')} · ${s.title}`;
  $('#out').className = 'out'; if (s.feature != null) { S.feature = s.feature; wire(); }
  location.hash = S.i + 1;
}
$('#prev').onclick = () => show(S.i - 1); $('#next').onclick = () => show(S.i + 1); $('#fs').onclick = () => document.documentElement.requestFullscreen?.();
$('#prog').onclick = (e) => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };
document.addEventListener('keydown', (e) => { if (e.target.tagName === 'TEXTAREA') return; if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(S.i + 1); } if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(S.i - 1); } if (e.key === 'Escape') $('#out').className = 'out'; });

// ---- reviewer ----
function feature() { return feats[S.feature]; }
function comments() { const f = feature(); S.comments[f.id] = S.comments[f.id] || []; return S.comments[f.id]; }
function wire() {
  const sec = document.querySelector(`.dk-slide[data-i="${S.i}"]`);
  $('#seg', sec).onclick = (e) => { if (e.target.dataset.vp) { S.vp = e.target.dataset.vp; renderPair(sec); } };
  $('#tabs', sec).onclick = (e) => { if (e.target.dataset.mode) { S.mode = e.target.dataset.mode; renderPair(sec); } };
  $('#approve', sec).onclick = () => { S.approved[feature().id] = true; save('approved', S.approved); show(S.i + 1); };
  $('#submitc', sec).onclick = () => showOut('comments'); $('#submitf', sec).onclick = () => showOut('fix');
  renderPair(sec);
}
function renderPair(sec) {
  const f = feature(), v = f.viewports[S.vp]; const pair = $('#pair', sec); pair.className = 'pair ' + S.vp;
  sec.querySelectorAll('#seg span').forEach(s => s.classList.toggle('on', s.dataset.vp === S.vp)); sec.querySelectorAll('#tabs span').forEach(s => s.classList.toggle('on', s.dataset.mode === S.mode));
  $('#meta', sec).textContent = `${v.size.width} × ${v.size.height}${v.after.offset ? ' · cropped' : ''}`;
  const side = (which) => { const a = v[which]; if (S.mode === 'shot') return a.screenshot ? `<img src="${a.screenshot}" alt="">` : `<p class="sm" style="padding:14px;color:#aaa">No screenshot was captured.</p>`; if (S.mode === 'video') return a.video ? `<video src="${a.video}" autoplay muted loop playsinline></video>` : `<p class="sm" style="padding:14px;color:#aaa">No video was recorded.</p>`; return `<iframe src="${a.live}" style="height:${S.vp === 'mobile' ? 520 : 420}px"></iframe>`; };
  const win = (which, label, tag) => `<div class="win ${which}"><div class="bar"><div class="dots"><span></span><span></span><span></span></div><div class="url dk-mono">${esc(label)}</div><span class="tag dk-mono">${esc(tag)}</span></div><div class="body">${side(which)}${which === 'after' ? '<div class="hit"></div><div class="pins"></div>' : ''}</div></div>`;
  pair.innerHTML = win('before', `${D.pr.repo} · ${D.pr.base}`, 'before') + win('after', `${D.pr.repo} · PR #${D.pr.number}`, 'after');
  const body = $('.after .body', sec); const hit = $('.hit', body); if (S.mode !== 'shot') hit.style.pointerEvents = 'none';
  const place = () => { renderPins(sec); renderBoxes(sec); }; const img = body.querySelector('img'); if (img && !img.complete) img.onload = place; else place();
  hit.onclick = (ev) => { if (S.mode !== 'shot') return; const r = body.getBoundingClientRect(); openComposer(sec, (ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height, ev.clientX - r.left, ev.clientY - r.top); };
  renderComments(sec);
}
function hitSource(x, y) { const v = feature().viewports[S.vp]; const sz = v.after.screenshotSize || v.size; const off = v.after.offset || { x: 0, y: 0 }; const px = x * sz.width + off.x, py = y * sz.height + off.y; let best = null, area = Infinity; for (const b of v.after.boxes || []) { const r = b.rect; if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h && r.w * r.h < area) { best = b; area = r.w * r.h; } } return best; }
function renderBoxes(sec) { const v = feature().viewports[S.vp]; const body = $('.after .body', sec); body.querySelectorAll('.box').forEach(e => e.remove()); if (S.mode !== 'shot') return; const sz = v.after.screenshotSize || v.size; const off = v.after.offset || { x: 0, y: 0 }; for (const b of (v.after.boxes || []).filter(b => b.src)) { const r = b.rect; const d = document.createElement('div'); d.className = 'box'; d.style.left = ((r.x - off.x) / sz.width * 100) + '%'; d.style.top = ((r.y - off.y) / sz.height * 100) + '%'; d.style.width = (r.w / sz.width * 100) + '%'; d.style.height = (r.h / sz.height * 100) + '%'; body.appendChild(d); } }
function renderPins(sec) { const pins = $('.pins', sec); const cs = comments(); pins.innerHTML = cs.map((c, i) => c.vp === S.vp ? `<span class="pin" style="left:${c.x * 100}%;top:${c.y * 100}%">${i + 1}</span>` : '').join(''); }
function openComposer(sec, x, y, px, py) { sec.querySelectorAll('.composer').forEach(e => e.remove()); const hit = hitSource(x, y); const body = $('.after .body', sec); const c = document.createElement('div'); c.className = 'composer'; c.style.left = Math.max(0, Math.min(px, body.clientWidth - 310)) + 'px'; c.style.top = Math.max(0, Math.min(py + 12, body.clientHeight - 140)) + 'px'; c.innerHTML = `<div class="src dk-mono">${hit && hit.src ? '→ ' + esc(hit.src) + (hit.text ? ' · "' + esc(hit.text.slice(0, 32)) + '"' : '') : 'no changed element here'} · ${S.vp}</div><textarea placeholder="What should change here?"></textarea><div class="b"><button class="ok">Add comment</button><button class="no">Cancel</button></div>`; body.appendChild(c); const ta = c.querySelector('textarea'); ta.focus(); c.querySelector('.no').onclick = () => c.remove(); c.querySelector('.ok').onclick = () => { const text = ta.value.trim(); if (!text) return; comments().push({ text, x, y, vp: S.vp, src: hit && hit.src || null, element: hit && hit.text || null, at: new Date().toISOString() }); save('comments', S.comments); c.remove(); renderPins(sec); renderComments(sec); }; }
function renderComments(sec) { const cs = comments(); const el = $('#clist', sec); el.innerHTML = cs.length ? cs.map((c, i) => `<div class="c"><span class="n">${i + 1}</span><span>${esc(c.text)}${c.src ? ` <code>${esc(c.src)}</code>` : ''} <span class="sm">· ${c.vp}</span></span><span class="x" data-i="${i}">✕</span></div>`).join('') : `<div class="sm">Click anywhere on the after pane to leave a comment.</div>`; el.querySelectorAll('.x').forEach(x => x.onclick = () => { cs.splice(+x.dataset.i, 1); save('comments', S.comments); renderPins(sec); renderComments(sec); }); }
function reviewMarkdown(mode) { const f = feature(), cs = comments(); const L = [`### Review of feature ${S.feature + 1}: ${f.title}`, '', `Expectation: ${f.expect}`, `Agent found: ${f.found}`, '']; if (!cs.length) L.push('_No comments._'); else cs.forEach((c, i) => L.push(`${i + 1}. ${c.text}${c.src ? ` (\`${c.src}\`)` : ''} · ${c.vp}${c.element ? ` · on "${c.element}"` : ''}`)); L.push('', mode === 'fix' ? '**Requested changes.** Fix each item on the PR branch, re-capture before/after at both viewports, and resubmit this feature. Unchanged features keep their approval.' : '_Left as comments._'); return L.join('\n'); }
function agentPrompt() { const f = feature(), cs = comments(); return `Review feedback on PR #${D.pr.number} (${D.pr.repo}), feature "${f.title}" (${f.id}), page ${f.page}:\n\n` + cs.map((c, i) => `${i + 1}. [${c.vp}] ${c.text}${c.src ? `\n   → ${c.src}` : ''}${c.element ? `\n   element: "${c.element}"` : ''}`).join('\n') + `\n\nFix these on the PR branch, stay within the files of this PR, re-capture this feature's evidence at the ${[...new Set(cs.map(c => c.vp))].join(' and ') || 'changed'} viewport(s), and regenerate the review. Reply with one short sentence saying what you will change, then do it.`; }
function showOut(mode) { const md = reviewMarkdown(mode); const out = $('#out'); out.className = 'out show'; const cmd = `gh pr review ${D.pr.number} --repo ${D.pr.repo} --comment --body-file review-${feature().id}.md`; out.innerHTML = `<span class="close dk-mono" id="oclose">close · esc</span><div class="k dk-mono">Review, as it posts to the PR</div><pre>${esc(md)}</pre><div class="k dk-mono">Command</div><pre>${esc(cmd)}</pre>${mode === 'fix' ? `<div class="k dk-mono">Prompt sent to the agent</div><pre>${esc(agentPrompt())}</pre>` : ''}<div class="btns"><span class="btn" id="dl" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">Download review-${esc(feature().id)}.md</span>${mode === 'fix' ? `<span class="btn" id="dlp" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">Download fix-prompt.md</span>` : ''}</div>`; $('#oclose').onclick = () => out.className = 'out'; $('#dl').onclick = () => download(`review-${feature().id}.md`, md); if (mode === 'fix') $('#dlp').onclick = () => download('fix-prompt.md', agentPrompt()); }
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' })); a.download = name; a.click(); }
show(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));
</script></body></html>
